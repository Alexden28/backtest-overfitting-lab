[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bolab"
version = "0.1.0"
description = "How much of a backtest is luck: deflated Sharpe ratio, PBO and walk-forward tests on 512 industry momentum strategies"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pasquale Alessandro Denora" }]
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "matplotlib>=3.7", "requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["bolab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
